prompts:
  - "{{bucket.sourceBucketId}}"

providers:
  - id: file://src/provider.js

defaultTest:
  options:
    # Read directly from GRADER_PROVIDER in .env (e.g. "openai:chat:gpt-4o" or
    # "anthropic:messages:claude-sonnet-4-5") — no default. That provider's own API
    # key must also be set (e.g. OPENAI_API_KEY) — promptfoo resolves that itself.
    provider: "{{ env.GRADER_PROVIDER }}"
  assert:
    - type: javascript
      metric: qa_match
      value: file://src/lib/qa-match-assertion.js
    - type: llm-rubric
      metric: report_quality
      value: >-
        Gold summary: {{expected.summarySynopsis}}
        The output above includes report.summary (the real summary) and citedDocumentsText (a map
        of fileName to extracted source-document text). Judge the real summary against the gold
        summary and citedDocumentsText on: completeness (does it cover the same key facts),
        clinical correctness, whether anything important from the gold summary is missing, and
        groundedness — whether every factual claim in the summary is actually supported by the
        combined text in citedDocumentsText, with no hallucinated (unsupported) information. Your
        score should reflect overall quality across all these criteria as a single 0-1 value.
    - type: javascript
      metric: metadata_match
      value: file://src/lib/metadata-match-assertion.js

# Test cases are generated live from the existing bucket named by SOURCE_BUCKET_ID
# (see scripts/build-tests-vars.js) into tests.vars.yaml — never hand-edit that file.
tests: file://tests.vars.yaml
