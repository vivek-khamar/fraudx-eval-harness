prompts:
  - "{{claimId}}"

providers:
  - id: file://provider.js

defaultTest:
  options:
    provider: anthropic:messages:claude-sonnet-4-5

tests:
  - vars:
      claimId: "FX-GOLD-5K-v1"
      documentIds: file://testdata/golden_claim_docs.json
      expected: file://testdata/golden_claim_expected.json
    assert:
      - type: llm-rubric
        metric: qa_summary_accuracy
        value: >-
          Gold summary: {{expected.summarySynopsis}}
          Gold Q&A: {{expected.qa | dump}}
          Pass only if the report's summary conveys the same key facts with no
          hallucinated content, and every answer matches its gold answer's meaning
          (exact wording not required).
      - type: javascript
        metric: citation_accuracy
        threshold: 0.95
        value: |-
          return context.vars.expected.qa.filter((e) => {
            const a = output.report.qa.find((x) => x.questionId === e.questionId);
            return a && a.citation.documentId === e.citation.documentId && a.citation.page === e.citation.page;
          }).length / context.vars.expected.qa.length;
