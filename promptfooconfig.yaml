prompts:
  - "{{claimId}}"

providers:
  - id: file://provider.js

defaultTest:
  options:
    # Read directly from GRADER_PROVIDER in .env (e.g. "openai:chat:gpt-4o" or
    # "anthropic:messages:claude-sonnet-4-5") — no default. That provider's own API
    # key must also be set (e.g. OPENAI_API_KEY) — promptfoo resolves that itself.
    provider: "{{ env.GRADER_PROVIDER }}"
  assert:
    - type: javascript
      metric: qa_match
      value: |-
        const matched = context.vars.expected.qa.filter((q) => {
          const actual = output.report.questions.find((r) => r.predefinedQuestionId === q.predefinedQuestionId);
          return actual && actual.riskStatus === q.expectedRiskStatus;
        }).length;
        return matched / context.vars.expected.qa.length;
    - type: llm-rubric
      metric: qa_grounding
      value: >-
        Gold Q&A with expected citations: {{expected.qa | dump}}
        The output above includes report.questions (the real answers) and citedDocumentsText
        (a map of fileName to that document's extracted text). For each gold Q&A entry with a
        non-empty expectedCitationFileNames, find the matching real answer by predefinedQuestionId,
        and check whether that answer's claim is actually supported by the text in
        citedDocumentsText for its cited fileName. Count how many are grounded, out of how many
        gold entries had an expected citation to check. Your score MUST equal
        (grounded count / checked count), not a generic confidence value. If no gold entries have
        an expected citation, your score is 1.
    - type: llm-rubric
      metric: report_quality
      value: >-
        Gold summary: {{expected.summarySynopsis}}
        The output above includes report.summary (the real summary). Judge the real summary
        against the gold summary on: completeness (does it cover the same key facts), clinical
        correctness, whether anything important from the gold summary is missing, and whether it
        introduces any hallucinated (unsupported) information. Your score should reflect overall
        quality across all four criteria as a single 0-1 value.
    - type: llm-rubric
      metric: hallucination_consistency
      value: >-
        The output above includes report.summary (the real summary) and citedDocumentsText (a map
        of fileName to extracted source-document text). Identify the distinct factual claims made
        in report.summary. For each, check whether it is supported by the combined text in
        citedDocumentsText. Count how many claims are factually consistent, out of how many
        distinct claims you identified. Your score MUST equal (consistent count / total claims
        identified), not a generic confidence value. If you can't identify any checkable claims in
        the summary, your score is 1.

# Test cases are generated from testdata/claims.json (see scripts/generate-tests-vars.js)
# into tests.vars.yaml — add a new golden claim there, not here or in tests.vars.yaml directly.
tests: file://tests.vars.yaml
