name: Eval Workflow

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Which flow to run'
        required: true
        type: choice
        options:
          - tests-only
          - full-eval
        default: full-eval
      newClaimName:
        description: 'Claim name'
        required: false
        type: string
        default: ''
      ingestionModelName:
        description: 'Ingestion model displayName'
        required: false
        type: string
        default: ''
      processingModelName:
        description: 'Processing model displayName'
        required: false
        type: string
        default: ''

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
      - run: npm ci
      - run: npm test

  full-eval:
    needs: unit-tests
    if: ${{ inputs.mode == 'full-eval' }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    concurrency:
      group: fraudx-full-eval
      cancel-in-progress: false
    env:
      FRAUDX_ENDPOINT_URI: ${{ secrets.FRAUDX_ENDPOINT_URI }}
      FRAUDX_LOGIN_EMAIL: ${{ secrets.FRAUDX_LOGIN_EMAIL }}
      FRAUDX_LOGIN_PASSWORD: ${{ secrets.FRAUDX_LOGIN_PASSWORD }}
      GRADER_PROVIDER: ${{ secrets.GRADER_PROVIDER }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_S3_BUCKET_NAME: ${{ secrets.AWS_S3_BUCKET_NAME }}
      CLAIM_NAME: ${{ inputs.newClaimName }}
      INGESTION_MODEL_NAME: ${{ inputs.ingestionModelName }}
      PROCESSING_MODEL_NAME: ${{ inputs.processingModelName }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
      - run: npm ci
      - run: npm run eval
      - name: Upload PDF reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: reports/**
          if-no-files-found: ignore
